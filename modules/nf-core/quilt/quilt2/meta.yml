name: "quilt_quilt2"
description: QUILT2 is an R and C++ program for fast genotype imputation from
  low-coverage sequence using a large reference panel.
keywords:
  - imputation
  - low-coverage
  - genotype
  - genomics
  - vcf
tools:
  - "quilt":
      description: "Fast genotype imputation from low-coverage sequence using a large reference panel"
      homepage: "https://github.com/rwdavies/QUILT"
      documentation: "https://github.com/rwdavies/QUILT"
      tool_dev_url: "https://github.com/rwdavies/QUILT"
      doi: "10.1038/s41467-025-67218-1"
      licence:
        - "GPL v3"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bams:
        type: file
        description: (Mandatory) BAM/CRAM files
        pattern: "*.{bam,cram,sam}"
        ontologies: []
    - bais:
        type: file
        description: (Mandatory) BAM/CRAM index files
        pattern: "*.{bai}"
        ontologies: []
    - bamlist:
        type: file
        description: (Optional) File with list of BAM/CRAM files to impute. One
          file per line.
        pattern: "*.{txt}"
        ontologies: []
    - samplename:
        type: file
        description: (Optional) File with list of sample names in the same order
          as in bamlist to impute. One file per line.
        pattern: "*.{txt}"
        ontologies: []
    - reference_vcf_file:
        type: file
        description: (Mandatory) Reference panel VCF with phased haplotypes.
        pattern: "*.{vcf,vcf.gz,bcf}"
        ontologies: []
    - reference_vcf_index:
        type: file
        description: (Mandatory) Index for the reference panel VCF.
        pattern: "*.{tbi,csi}"
        ontologies: []
    - posfile:
        type: file
        description: (Optional) File with positions of where to impute, lining up
          one-to-one with genfile.
        pattern: "*.{txt}"
        ontologies: []
    - phasefile:
        type: file
        description: (Optional) File with truth phasing results.
        pattern: "*.{txt}"
        ontologies: []
    - genfile:
        type: file
        description: (Optional) Path to gen file with high coverage results.
        pattern: "*.{txt}"
        ontologies: []
    - chr:
        type: string
        description: (Mandatory) What chromosome to run. Should match BAM headers.
    - regions_start:
        type: integer
        description: (Mandatory) When running imputation, where to start from.
    - regions_end:
        type: integer
        description: (Mandatory) When running imputation, where to stop.
    - ngen:
        type: integer
        description: Number of generations since founding or mixing.
    - buffer:
        type: integer
        description: Buffer of region to perform imputation over.
    - genetic_map:
        type: file
        description: (Optional) File with genetic map information.
        pattern: "*.{txt,map}{,gz}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: (Optional) File with reference genome.
        pattern: "*.{fa,fasta}"
        ontologies: []
    - fasta_fai:
        type: file
        description: (Optional) File with reference genome index.
        pattern: "*.{fai}"
        ontologies: []
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.vcf.gz":
          type: file
          description: VCF file with both SNP annotation information and
            per-sample genotype information.
          pattern: "*.{vcf.gz}"
          ontologies: []
  tbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.vcf.gz.tbi":
          type: file
          description: TBI file of the VCF.
          pattern: "*.{vcf.gz.tbi}"
          ontologies: []
  rdata:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - RData:
          type: directory
          description: |
            Folder of RData objects generated during the imputation process.
          pattern: "RData"
  plots:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - plots:
          type: directory
          description: |
            Folder of plots generated during the imputation process.
          pattern: "plots"
  versions_r_quilt:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-quilt:
          type: string
          description: The name of the tool
      - Rscript -e "cat(as.character(packageVersion('QUILT')))":
          type: eval
          description: The expression to obtain the version of the tool
  versions_r_base:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-base:
          type: string
          description: The name of the tool
      - R --version | sed "1!d; s/.*version //; s/ .*//":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-quilt:
          type: string
          description: The name of the tool
      - Rscript -e "cat(as.character(packageVersion('QUILT')))":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-base:
          type: string
          description: The name of the tool
      - R --version | sed "1!d; s/.*version //; s/ .*//":
          type: eval
          description: The expression to obtain the version of the tool
