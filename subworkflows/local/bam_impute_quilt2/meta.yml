name: "bam_impute_quilt2"
description: Impute low-coverage BAM/CRAM inputs with QUILT2 and ligate chunked
  outputs per chromosome.
keywords:
  - imputation
  - low-coverage
  - bam
  - cram
  - vcf
components:
  - quilt/quilt2
  - glimpse2/ligate
  - bcftools/index
input:
  - ch_input:
      type: channel
      description: BAM/CRAM input batches with optional rename files.
  - ch_reference_panel:
      type: channel
      description: Reference panel VCF per chromosome.
  - ch_chunks:
      type: channel
      description: Imputation chunks per chromosome.
  - ch_map:
      type: channel
      description: Genetic map per chromosome.
  - ch_fasta:
      type: channel
      description: Reference FASTA, required for CRAM inputs.
  - n_gen:
      type: integer
      description: Number of generations since founding or mixing.
  - buffer:
      type: integer
      description: Buffer of region to perform imputation over.
output:
  - vcf_index:
      type: channel
      description: Imputed and indexed VCF files per chromosome.
